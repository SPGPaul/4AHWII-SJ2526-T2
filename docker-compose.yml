services:
  web:
    restart: unless-stopped
    build:
      context: ./web/
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    ports:
      - "3001:80"
    depends_on:
      - ollama
    networks:
      - web-ollama

  ollama:
    build: .
    image: ollama-custom:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - web-ollama

volumes:
  ollama-data:

networks:
  web-ollama:
    name: web-ollama
    driver: bridge
