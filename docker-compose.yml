services:
  vuetify-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # environment:
      # - NODE_ENV=production
    volumes:
      - .:/app
      - node_modules:/usr/src/app/node_modules
    command: npm run dev -- --host

volumes:
  node_modules:
  