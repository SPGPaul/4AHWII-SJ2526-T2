services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen3:0.6b
    depends_on:
      - ollama
  web:
    restart: unless-stopped
    build:
      context: ./web/
      dockerfile: Dockerfile
    ports:
        - "3001:3000"
    environment:
      - NODE_ENV=development
    # - NODE_ENV=production
    depends_on:
      - backend
    # environment:
    #   DATABASE_HOST: db
    volumes:
      - ./web:/app
      - node_modules:/usr/src/app/node_modules
    command: npm run dev -- --host
    networks:
      - web-strapi

  strapi:
    container_name: strapi
    build:
      context: ./strapi-DB/
      dockerfile: Dockerfile
    image: strapi:latest
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./strapi-db/config:/opt/app/config
      - ./strapi-db/src:/opt/app/src
      - ./strapi-db/package.json:/opt/app
      - ./strapi-db/yarn.lock:/opt/yarn.lock
      - ./.env:/opt/app/.env
      - ./strapi-db/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - web-strapi
      - strapi-strapiDB
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDB
    #platform: linux/amd64 #for platform error on Apple M1 chips
    restart: unless-stopped
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/ #using a volume
      #- ./data:/var/lib/postgresql/data/ # if you want to use a bind folder

    ports:
      - "5432:5432"
    networks:
      - strapi-strapiDB

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull qwen3:0.6b"
    restart: "no"

volumes:
  node_modules:
  db-data:
  strapi-data:
  ollama-data:

networks:
  strapi-strapiDB: #backend network
    name: strapi-strapiDB
    driver: bridge
  web-strapi: #frontend network
    name: web-strapi
    driver: bridge
