<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR mit minicpm-v</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #22c55e;
        --primary-hover: #16a34a;
        --border: #334155;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 24px;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }

      .card {
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 32px;
      }

      p {
        color: var(--muted);
        line-height: 1.5;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }

      .panel {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      input[type="file"] {
        display: block;
        width: 100%;
        padding: 10px;
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }

      .btn-secondary {
        background: #334155;
        color: white;
      }

      .btn-secondary:hover {
        background: #475569;
      }

      .btn-danger {
        background: var(--danger);
        color: white;
      }

      .btn-danger:hover {
        background: #dc2626;
      }

      .preview-box {
        min-height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        border: 1px dashed var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .preview-box img {
        max-width: 100%;
        max-height: 360px;
        display: none;
      }

      .placeholder {
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }

      .meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
        word-break: break-word;
      }

      .status {
        margin-top: 16px;
        min-height: 24px;
        font-weight: bold;
      }

      .status.ok {
        color: #4ade80;
      }

      .status.error {
        color: #f87171;
      }

      textarea {
        width: 100%;
        min-height: 320px;
        margin-top: 12px;
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        resize: vertical;
        line-height: 1.5;
        font-size: 15px;
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 10px;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Text aus Bild extrahieren</h1>
        <p>
          Wähle eine Bilddatei aus und sende sie an dein Express-Backend. Der
          extrahierte Text von minicpm-v wird unten angezeigt.
        </p>

        <div class="grid">
          <div class="panel">
            <label for="fileInput">Bild auswählen</label>
            <input id="fileInput" type="file" accept="image/*" />

            <div class="actions">
              <button id="extractBtn" class="btn-primary" type="button">
                Normal extrahieren
              </button>
              <button id="streamBtn" class="btn-secondary" type="button">
                Streaming extrahieren
              </button>
              <button id="clearBtn" class="btn-danger" type="button">
                Zurücksetzen
              </button>
            </div>

            <div id="status" class="status"></div>
            <div class="hint">
              Erlaubt sind Bilddateien; dein Backend prüft zusätzlich den
              MIME-Type und begrenzt die Dateigröße.
            </div>

            <div class="meta" id="fileMeta">Keine Datei ausgewählt.</div>
          </div>

          <div class="panel">
            <label>Vorschau</label>
            <div class="preview-box">
              <div id="placeholder" class="placeholder">
                Noch kein Bild ausgewählt
              </div>
              <img id="preview" alt="Bildvorschau" />
            </div>
          </div>
        </div>

        <div class="panel" style="margin-top: 20px">
          <label for="result">Extrahierter Text</label>
          <textarea
            id="result"
            placeholder="Hier erscheint der extrahierte Text..."
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const extractBtn = document.getElementById("extractBtn");
      const streamBtn = document.getElementById("streamBtn");
      const clearBtn = document.getElementById("clearBtn");
      const result = document.getElementById("result");
      const statusEl = document.getElementById("status");
      const preview = document.getElementById("preview");
      const placeholder = document.getElementById("placeholder");
      const fileMeta = document.getElementById("fileMeta");

      let currentAbortController = null;

      function setStatus(message, type = "") {
        statusEl.className = "status" + (type ? " " + type : "");
        statusEl.innerHTML = message;
      }

      function getSelectedFile() {
        const file = fileInput.files?.[0];
        if (!file) {
          setStatus("Bitte zuerst eine Bilddatei auswählen.", "error");
          return null;
        }
        return file;
      }

      function updatePreview(file) {
        if (!file) {
          preview.style.display = "none";
          preview.removeAttribute("src");
          placeholder.style.display = "block";
          fileMeta.textContent = "Keine Datei ausgewählt.";
          return;
        }

        fileMeta.textContent = `Datei: ${file.name} | Typ: ${file.type || "unbekannt"} | Größe: ${(file.size / 1024 / 1024).toFixed(2)} MB`;

        const reader = new FileReader();

        reader.onload = () => {
          preview.src = reader.result;
          preview.style.display = "block";
          placeholder.style.display = "none";
        };

        reader.onerror = () => {
          preview.style.display = "none";
          preview.removeAttribute("src");
          placeholder.style.display = "block";
          setStatus("Bildvorschau konnte nicht geladen werden.", "error");
        };

        reader.readAsDataURL(file);
      }

      fileInput.addEventListener("change", () => {
        const file = fileInput.files?.[0];
        updatePreview(file);
        setStatus("");
      });

      clearBtn.addEventListener("click", () => {
        if (currentAbortController) {
          currentAbortController.abort();
          currentAbortController = null;
        }
        fileInput.value = "";
        result.value = "";
        updatePreview(null);
        setStatus("Zurückgesetzt.");
      });

      async function uploadNormal() {
        const file = getSelectedFile();
        if (!file) return;

        if (currentAbortController) {
          currentAbortController.abort();
        }
        currentAbortController = new AbortController();

        try {
          result.value = "";
          setStatus('<span class="spinner"></span>Text wird extrahiert ...');

          const formData = new FormData();
          formData.append("file", file);

          const resp = await fetch("/api/ai-upload", {
            method: "POST",
            body: formData,
            signal: currentAbortController.signal,
          });

          const data = await resp.json().catch(() => ({}));

          if (!resp.ok) {
            throw new Error(data?.error || "upload_failed");
          }

          const text = data?.model_text || "";

          if (!text.trim()) {
            setStatus(
              "Modell hat geantwortet, aber keinen Text geliefert.",
              "error",
            );
            console.log("RAW BACKEND RESPONSE:", data);
            result.value = "";
            return;
          }

          result.value = text;
          setStatus("Extraktion abgeschlossen.", "ok");
        } catch (err) {
          if (err.name === "AbortError") {
            setStatus("Anfrage abgebrochen.", "error");
            return;
          }
          setStatus(`Fehler: ${err.message}`, "error");
        } finally {
          currentAbortController = null;
        }
      }

      async function uploadStream() {
        const file = getSelectedFile();
        if (!file) return;

        if (currentAbortController) {
          currentAbortController.abort();
        }
        currentAbortController = new AbortController();

        try {
          result.value = "";
          setStatus('<span class="spinner"></span>Streaming läuft ...');

          const formData = new FormData();
          formData.append("file", file);

          const resp = await fetch("/api/ai/stream-upload", {
            method: "POST",
            body: formData,
            signal: currentAbortController.signal,
            headers: {
              Accept: "text/event-stream",
            },
          });

          if (!resp.ok || !resp.body) {
            const txt = await resp.text().catch(() => "");
            throw new Error(txt || `HTTP ${resp.status}`);
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let doneReceived = false;

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            let splitIndex;
            while ((splitIndex = buffer.indexOf("\n\n")) !== -1) {
              const rawEvent = buffer.slice(0, splitIndex);
              buffer = buffer.slice(splitIndex + 2);

              const lines = rawEvent.split("\n");
              let eventName = "message";
              const dataLines = [];

              for (const line of lines) {
                if (line.startsWith(":")) continue;
                if (line.startsWith("event:")) {
                  eventName = line.slice(6).trim();
                } else if (line.startsWith("data:")) {
                  dataLines.push(line.slice(5).trim());
                }
              }

              if (!dataLines.length) continue;

              const dataText = dataLines.join("\n");
              let payload = dataText;

              try {
                payload = JSON.parse(dataText);
              } catch {}

              if (eventName === "done") {
                doneReceived = true;
                setStatus("Streaming abgeschlossen.", "ok");
                break;
              }

              if (eventName === "error") {
                throw new Error(
                  typeof payload === "string" ? payload : "model_error",
                );
              }

              if (typeof payload === "string") {
                result.value += payload;
              } else {
                result.value += String(payload ?? "");
              }
            }

            if (doneReceived) break;
          }

          if (!result.value.trim()) {
            setStatus(
              "Streaming abgeschlossen, aber das Modell hat keinen Text geliefert.",
              "error",
            );
          }
          if (!doneReceived) {
            setStatus("Streaming beendet.", "ok");
          }
        } catch (err) {
          if (err.name === "AbortError") {
            setStatus("Streaming abgebrochen.", "error");
            return;
          }
          setStatus(`Fehler: ${err.message}`, "error");
        } finally {
          currentAbortController = null;
        }
      }

      extractBtn.addEventListener("click", uploadNormal);
      streamBtn.addEventListener("click", uploadStream);
    </script>
  </body>
</html>
